  <form id="todoForm">
    <input class="input-field" type="text" id="title" placeholder="Title" required />
    <input class="input-field"  type="text" id="description" placeholder="Description" required />
    <input class="input-field"  type="text" id="location" placeholder="Location"  required/>
    <input class="input-field"  type="email" id="email" placeholder="Email" required/>
    <select class="input-field  form-select"  id="status" required>
        <option value="">Select Status</option>
        <option value="pending">Pending</option>
        <option value="inProgress">In Progress</option>
        <option value="done">Done</option>
    </select>
    <select class="input-field  form-select"  id="category" required>
        <option value="">Select Category</option>
        <option value="personal">Personal</option>
        <option value="delegated">Delegated</option>
    </select>
    <select class="input-field"  id="priority" required>
        <option value="">Select Priority</option>
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
    </select>
    <input class="input-field"  type="time" id="time" required />
    <button id="submit-btn" type="submit" class="btn btn-success">Save</button>
</form>
