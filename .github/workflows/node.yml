name: MERN CI Pipeline

on:
  push:
    branches:
      - working-version

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.3.0

      - name: Install Server Dependencies
        run: cd server && rm -rf node_modules package-lock.json && npm install

      - name: Install Client Dependencies
        run: cd client && rm -rf node_modules package-lock.json && npm install

      - name: Build Client
        run: cd client && npm run build

      - name: Run client
        run: cd client && npm start

      - name: Run server
        run: cd server && node app.js