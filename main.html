<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <!-- font awesome -->
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
      <!-- google fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playwrite+IN+Guides&family=Playwrite+NZ+Basic:wght@100..400&display=swap" rel="stylesheet">

<!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Bootstrap Icons CDN -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net">
 
   
<link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>

    <title>Advance Todo App</title>
</head>
<body>
<div class="main-container container-fluid">
    <h1>Advance-Todo-App</h1>
    <div class="todo bg-light">
        <div class="top-card">
            <input class="search-field" oninput="handleChange(this.value)" type="text" placeholder="search by title" />
            <!-- <button id="grid-button"  type="button" class="btn btn-outline-primary" data-toggle="tooltip" data-placement="top" title="Tooltip on top"  onclick="listGrid()">
                <i class="fa-solid fa-table-cells"></i>
            </button>
            <button  data-toggle="tooltip" data-placement="top" title="Tooltip on top" id="filter-button" type="button" class="btn btn-outline-info"  onclick="filter()">
                <i class="fa-solid fa-filter"></i>
            </button> -->
            <button id="grid-button"  class="btn btn-outline-primary"  type="button"
    data-bs-toggle="tooltip" data-bs-placement="top" title="List gird div" onclick="listGrid()">
    <i class="fa-solid fa-table-cells"></i>
</button>

<button id="filter-button" type="button" class="btn btn-outline-info" 
    data-bs-toggle="tooltip" data-bs-placement="top" title="filter buttton" onclick="filter()">
    <i class="fa-solid fa-filter"></i>
</button>
            <button  type="button"
    data-bs-toggle="tooltip" data-bs-placement="top" title="Add new todo" class="btn btn-outline-secondary"  onclick="window.location.href='GetData.html'"><i class="fa-solid fa-plus"></i></button>
            <button type="button" class="btn btn-outline-secondary delete-multiple-btn" onclick="deleteMultiple()"><i class="fa-solid fa-circle-minus"></i></button>
        </div>

        <table class="table-sm table-success">
            <thead>
            <tr>
                <th class="checkbox-header"></th>
                <th class="indexing">#</th>
                <th class="title">Title <i class="fa-solid fa-arrow-up"></i></th>
                <th class="description">Description <i class="fa-solid fa-arrow-up"></i></th>
                <th class="location">Location <i class="fa-solid fa-arrow-up"></i></th>
                <th class="email">Email <i class="fa-solid fa-arrow-up"></i></th>
                <th class="status">Status<i class="fa-solid fa-arrow-up"></i></th>
                <th class="category">Category<i class="fa-solid fa-arrow-up"></i></th>
                <th class="priority">Priority<i class="fa-solid fa-arrow-up"></i></th> 
                <th class="time">Time<i class="fa-solid fa-arrow-up"></i></th>
                <th>Edit</th>
                <th>Del</th>
            </tr>
            </thead>
            <tbody class="table-group-divider main-table"></tbody>
        </table>
    
        <div class="list-div"></div>
        
       <div class="pagination">
    <button id="prev"  type="button" class="btn btn-outline-secondary d-flex justigy-content-center  align-items-center me-2"><i class="fa-solid fa-angle-left"></i></button>
    <span id="page-info"></span>
    <button id="next" type="button" class="btn btn-outline-secondary  d-flex justigy-content-center  align-items-center ms-2"><i class="fa-solid fa-angle-right"></i></button>
       </div>
    </div>

    <!-- <div class="delete-popup">
        <p>Are you sure, you want to delete?</p>
        <button class="yes btn btn-sm btn-danger me-2">Yes</button>
        <button class="no btn btn-sm btn-success">No</button>
    </div> -->
    <div class=" filter-popup">
        <button class="close-filter-icon"><i class="fa-solid fa-x"></i></button>
        <label for="status">Select Status</label>
        <br>
        <select  class="select-status-filter-options form-select" value="" id="status">
            <option value="all">All</option>
            <option value="done">Done</option>
            <option value="inProgress">InProgress</option>
            <option value="pending">Pending</option>
        </select>
    </div>
</div>


<!-- Bootstrap JS Bundle (with Popper) -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
</body>
</html>
